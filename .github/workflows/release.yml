name: 'Build and Release'

'on':
  push:
    tags:
      - '[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version / tag (e.g., 7.4.0)'
        required: false
        default: '7.4.0'
        type: string
      title:
        description: 'Release Title Highlight (Title Case)'
        required: false
        default: 'Performance Overhaul, Texture Protection & Chat Virtualization'
        type: string
      notes:
        description: 'Custom Release Notes (leave empty to use standard template)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Run Windows Build Script
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\tools\build_all.ps1

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            publish/BC-Windows.exe
            publish/BC-Windows-Hidden.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true
          cd platform/linux
          npm install

      - name: Build Linux Standalone AppImages & Tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd platform/linux
          node build.js

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            publish/BC-Linux.AppImage
            publish/BC-Linux.tar.gz
            publish/BC-Linux-Hidden.AppImage
            publish/BC-Linux-Hidden.tar.gz
            publish/linux/BC-Linux.AppImage
            publish/linux/BC-Linux.tar.gz
            publish/linux/BC-Linux-Hidden.AppImage
            publish/linux/BC-Linux-Hidden.tar.gz

  release:
    needs: [build-windows, build-linux]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: publish

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: publish

      - name: Prepare Tag and Release Notes
        shell: powershell
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          $inputVer = if ($env:INPUT_VERSION) { $env:INPUT_VERSION.Trim() } else { "" }
          $refTag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME.Trim().TrimStart('v') } else { "" }
          $ver = if ($inputVer.Length -gt 0) { $inputVer } elseif ($refTag.Length -gt 0) { $refTag } else { "7.4.0" }

          $inputTitle = if ($env:INPUT_TITLE) { $env:INPUT_TITLE.Trim() } else { "" }
          $title = if ($inputTitle.Length -gt 0) { $inputTitle } else { "Performance Overhaul, Texture Protection & Chat Virtualization" }

          $customNotes = if ($env:INPUT_NOTES) { $env:INPUT_NOTES.Trim() } else { "" }

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f $ver
          git push origin $ver --force

          if ($customNotes.Length -gt 0) {
            Set-Content -Path "RELEASE_NOTES.md" -Value $customNotes -Encoding UTF8
          } elseif (-not (Test-Path "RELEASE_NOTES.md")) {
            $defaultNotes = @(
              "### Fixes & Improvements:",
              "",
              "- **Improvement (Room Texture Protection & Canvas VRAM):** Protected active room character textures from flickering during texture maintenance, and immediately reclaim GPU canvas buffers when characters leave the room to prevent VRAM growth.",
              "- **Improvement (Chat Log Virtualization & Performance):** Modern CSS content-visibility virtualization renders only visible chat messages, eliminating scroll lag and GPU overhead during long conversations without clearing history.",
              "- **Improvement (Input & High-Polling Mouse):** Passive pointer event listeners deliver smooth responsiveness with high-polling-rate gaming mice (1000Hz+), while preventing chat input from triggering redundant focus checks.",
              "- **Fix (Addon Memory & Rendering Optimization):** Reclaimed temporary canvas allocations in petsuit animations to prevent VRAM accumulation, and eliminated heavy text-shadow blur layers in HUD overlays.",
              "",
              "### Downloads:",
              "",
              "- **BC-Windows.exe (~160MB):** Self-contained single executable for Windows 10/11. No .NET runtime required. Just download and run.",
              "- **BC-Windows-Hidden.exe (~160MB):** Same as Windows Standalone, but with no icon and a blank app name (Discreet mode).",
              "- **BC-Linux.AppImage (~108MB) [Recommended]:** Portable single-file executable for Linux (Ubuntu, Debian, Fedora, Arch, Steam Deck).",
              "- **BC-Linux-Hidden.AppImage (~108MB):** Same as Linux AppImage, with no icon and a blank app name (Discreet mode).",
              "- **BC-Linux.tar.gz (~102MB) [Fallback]:** Portable archive for systems without FUSE or minimal distributions.",
              "- **BC-Linux-Hidden.tar.gz (~102MB):** Same as Linux tarball, with no icon and a blank app name (Discreet mode)."
            )
            Set-Content -Path "RELEASE_NOTES.md" -Value $defaultNotes -Encoding UTF8
          }

      - name: Create or Update GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TITLE: ${{ inputs.title }}
        run: |
          $inputVer = if ($env:INPUT_VERSION) { $env:INPUT_VERSION.Trim() } else { "" }
          $refTag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME.Trim().TrimStart('v') } else { "" }
          $ver = if ($inputVer.Length -gt 0) { $inputVer } elseif ($refTag.Length -gt 0) { $refTag } else { "7.4.0" }

          $inputTitle = if ($env:INPUT_TITLE) { $env:INPUT_TITLE.Trim() } else { "" }
          $title = if ($inputTitle.Length -gt 0) { $inputTitle } else { "Performance Overhaul, Texture Protection & Chat Virtualization" }
          $releaseTitle = if ($title.Length -gt 0) { "v$ver - $title" } else { "v$ver" }

          $releaseAssets = @(
            "publish/BC-Windows.exe",
            "publish/BC-Windows-Hidden.exe",
            "publish/BC-Linux.AppImage",
            "publish/BC-Linux.tar.gz",
            "publish/BC-Linux-Hidden.AppImage",
            "publish/BC-Linux-Hidden.tar.gz"
          ) | Where-Object { Test-Path $_ }

          $existingTags = gh release list -L 100 --json tagName -q ".[].tagName"
          $releaseExists = if ($existingTags) { @($existingTags -split "\r?\n" | ForEach-Object { $_.Trim() }) } else { @() }

          if ($releaseExists -contains $ver) {
            Write-Host "Release $ver already exists. Updating release notes and re-uploading assets..."
            gh release edit $ver --title $releaseTitle --notes-file RELEASE_NOTES.md
            gh release upload $ver $releaseAssets --clobber
          } else {
            Write-Host "Creating new release for $ver..."
            gh release create $ver --title $releaseTitle --notes-file RELEASE_NOTES.md $releaseAssets
          }

      - name: Purge jsDelivr Edge Cache
        if: always()
        shell: powershell
        run: |
          Write-Host "Purging jsDelivr edge cache for scripts..."
          $files = (Get-ChildItem -Path "Scripts" -Recurse -Filter "*.js" -ErrorAction SilentlyContinue | Resolve-Path -Relative) + @("loader.user.js")
          Invoke-RestMethod -Uri "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/" -Method Get -ErrorAction SilentlyContinue
          foreach ($f in $files) {
              $cleanPath = $f.TrimStart(".\").Replace("\", "/")
              Write-Host "Purging: $cleanPath"
              Invoke-RestMethod -Uri "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$cleanPath" -Method Get -ErrorAction SilentlyContinue
          }
          Write-Host "jsDelivr cache purge complete!"

      - name: Clean up Workspace
        if: always()
        shell: powershell
        run: |
          Write-Host "Cleaning up build artifacts and temporary files..."
          Remove-Item "publish" -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Cleanup completed!"
