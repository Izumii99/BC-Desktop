name: 'Build and Release'

'on':
  push:
    tags:
      - '[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version / tag (e.g., 6.1)'
        required: false
        default: '6.1'
        type: string
      title:
        description: 'Release Title Highlight (Title Case)'
        required: false
        default: 'Single-File Seamless App & Built-in Addon Loader'
        type: string
      notes:
        description: 'Custom Release Notes (leave empty to use standard template)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Run Build Script (build_all.ps1)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\build_all.ps1

      - name: Verify Executable Artifacts
        shell: powershell
        run: |
          $exes = Get-ChildItem "publish/*.exe"
          if ($exes.Count -lt 4) {
            Write-Error "Expected 4 executable packages in publish/, but found $($exes.Count)!"
            exit 1
          }
          $exes | Select-Object Name, Length | Format-Table

      - name: Prepare Tag and Release Notes
        shell: powershell
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          $inputVer = if ($env:INPUT_VERSION) { $env:INPUT_VERSION.Trim() } else { "" }
          $refTag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME.Trim().TrimStart('v') } else { "" }
          $ver = if ($inputVer.Length -gt 0) { $inputVer } elseif ($refTag.Length -gt 0) { $refTag } else { "6.1" }

          $inputTitle = if ($env:INPUT_TITLE) { $env:INPUT_TITLE.Trim() } else { "" }
          $title = if ($inputTitle.Length -gt 0) { $inputTitle } else { "Single-File Seamless App & Built-in Addon Loader" }

          $customNotes = if ($env:INPUT_NOTES) { $env:INPUT_NOTES.Trim() } else { "" }

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f $ver
          git push origin $ver --force

          if ($customNotes.Length -gt 0) {
            Set-Content -Path "RELEASE_NOTES.md" -Value $customNotes -Encoding UTF8
          } elseif (-not (Test-Path "RELEASE_NOTES.md")) {
            $defaultNotes = @(
              "### Fixes & Improvements:",
              "",
              "- **Highlight ($ver):** $title.",
              "- **Feature (Single-File Seamless Executable):** Remote addon loader is now embedded directly into the application binary. No zip extraction needed.",
              "- **Internal Cleanliness & Maintenance:** Regular maintenance, performance enhancements, and dependency updates.",
              "",
              "### Downloads:",
              "",
              "- **BC-Desktop-Standalone.exe (~160MB):** Self-contained executable. No .NET runtime required. Just download and run.",
              "- **BC-Desktop-Lightweight.exe (~6MB):** Extremely small footprint. Requires the [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/en-us/download/dotnet/8.0).",
              "- **BC-Desktop-Standalone-Hidden.exe (~160MB):** Same as Standalone, but with no icon and a blank app name (Discreet mode).",
              "- **BC-Desktop-Lightweight-Hidden.exe (~6MB):** Same as Lightweight, but with no icon and a blank app name (Discreet mode)."
            )
            Set-Content -Path "RELEASE_NOTES.md" -Value $defaultNotes -Encoding UTF8
          }

      - name: Create or Update GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TITLE: ${{ inputs.title }}
        run: |
          $inputVer = if ($env:INPUT_VERSION) { $env:INPUT_VERSION.Trim() } else { "" }
          $refTag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME.Trim().TrimStart('v') } else { "" }
          $ver = if ($inputVer.Length -gt 0) { $inputVer } elseif ($refTag.Length -gt 0) { $refTag } else { "6.1" }

          $inputTitle = if ($env:INPUT_TITLE) { $env:INPUT_TITLE.Trim() } else { "" }
          $title = if ($inputTitle.Length -gt 0) { $inputTitle } else { "Single-File Seamless App & Built-in Addon Loader" }
          $releaseTitle = if ($title.Length -gt 0) { "v$ver - $title" } else { "v$ver" }

          $existingTags = gh release list -L 100 --json tagName -q ".[].tagName"
          $releaseExists = if ($existingTags) { @($existingTags -split "\r?\n" | ForEach-Object { $_.Trim() }) } else { @() }

          if ($releaseExists -contains $ver) {
            Write-Host "Release $ver already exists. Updating release notes and re-uploading assets..."
            gh release edit $ver --title $releaseTitle --notes-file RELEASE_NOTES.md
            gh release upload $ver `
              publish/BC-Desktop-Standalone.exe `
              publish/BC-Desktop-Lightweight.exe `
              publish/BC-Desktop-Standalone-Hidden.exe `
              publish/BC-Desktop-Lightweight-Hidden.exe `
              --clobber
          } else {
            Write-Host "Creating new release for $ver..."
            gh release create $ver `
              --title $releaseTitle `
              --notes-file RELEASE_NOTES.md `
              publish/BC-Desktop-Standalone.exe `
              publish/BC-Desktop-Lightweight.exe `
              publish/BC-Desktop-Standalone-Hidden.exe `
              publish/BC-Desktop-Lightweight-Hidden.exe
          }

      - name: Purge jsDelivr Edge Cache
        if: always()
        shell: powershell
        run: |
          Write-Host "Purging jsDelivr edge cache for scripts..."
          $files = Get-ChildItem -Path "Scripts", "PublishLoader" -Recurse -Filter "*.js" -ErrorAction SilentlyContinue | Resolve-Path -Relative
          Invoke-RestMethod -Uri "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/" -Method Get -ErrorAction SilentlyContinue
          foreach ($f in $files) {
              $cleanPath = $f.TrimStart(".\").Replace("\", "/")
              Write-Host "Purging: $cleanPath"
              Invoke-RestMethod -Uri "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$cleanPath" -Method Get -ErrorAction SilentlyContinue
          }
          Write-Host "jsDelivr cache purge complete!"

      - name: Clean up Workspace
        if: always()
        shell: powershell
        run: |
          Write-Host "Cleaning up build artifacts and temporary files..."
          Remove-Item "publish" -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Cleanup completed!"
