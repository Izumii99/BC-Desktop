name: Feature Request
description: Suggest an idea or enhancement for BC Desktop
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea or quality-of-life feature to make BC Desktop even better? Let us know!
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Proposal
      description: A clear and concise description of the feature or quality-of-life improvement.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Problem or Motivation
      description: Why would this feature be useful for players?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
    validations:
      required: false
