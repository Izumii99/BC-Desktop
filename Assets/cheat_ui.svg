<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a164d" />
      <stop offset="45%" stop-color="#140d28" />
      <stop offset="100%" stop-color="#090614" />
    </radialGradient>

    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="75%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="neonGlowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur1" />
      <feGaussianBlur stdDeviation="35" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonGlowPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="outerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="glow" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.65  0 0 0 0 0.35  0 0 0 0 0.95  0 0 0 0.5 0" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Glyph Gradients -->
    <linearGradient id="cOuterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="35%" stop-color="#2e1065" />
      <stop offset="70%" stop-color="#1e1145" />
      <stop offset="100%" stop-color="#130b2e" />
    </linearGradient>

    <linearGradient id="neonBevelOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#c084fc" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241247" />
      <stop offset="50%" stop-color="#16092e" />
      <stop offset="100%" stop-color="#0b0518" />
    </linearGradient>

    <linearGradient id="facetHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="30%" stop-color="#c084fc" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Clip Paths -->
    <clipPath id="squircleClip">
      <rect x="64" y="64" width="896" height="896" rx="224" ry="224" />
    </clipPath>
  </defs>

  <!-- Ambient Under-Glow behind the Tile -->
  <rect x="100" y="100" width="824" height="824" rx="220" ry="220" fill="none" stroke="url(#squircleBorder)" stroke-width="32" opacity="0.45" filter="url(#neonGlowPurple)" />

  <!-- Main Tile (Squircle with True Alpha Outside) -->
  <g clip-path="url(#squircleClip)">
    <!-- Base Background -->
    <rect x="64" y="64" width="896" height="896" fill="url(#bgGlow)" />

    <!-- Cyber Grid Overlay -->
    <g stroke="#a855f7" stroke-width="1.5" opacity="0.12">
      <line x1="64" y1="192" x2="960" y2="192" />
      <line x1="64" y1="320" x2="960" y2="320" />
      <line x1="64" y1="448" x2="960" y2="448" />
      <line x1="64" y1="576" x2="960" y2="576" />
      <line x1="64" y1="704" x2="960" y2="704" />
      <line x1="64" y1="832" x2="960" y2="832" />
      <line x1="192" y1="64" x2="192" y2="960" />
      <line x1="320" y1="64" x2="320" y2="960" />
      <line x1="448" y1="64" x2="448" y2="960" />
      <line x1="576" y1="64" x2="576" y2="960" />
      <line x1="704" y1="64" x2="704" y2="960" />
      <line x1="832" y1="64" x2="832" y2="960" />
    </g>

    <!-- Futuristic Tech Circuit Traces -->
    <path d="M 128 320 L 220 320 L 280 260 L 400 260" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.25" />
    <circle cx="400" cy="260" r="4" fill="#38bdf8" opacity="0.4" />
    <path d="M 896 704 L 804 704 L 744 764 L 624 764" fill="none" stroke="#ec4899" stroke-width="2.5" opacity="0.25" />
    <circle cx="624" cy="764" r="4" fill="#ec4899" opacity="0.4" />

    <!-- Subtle Center Radial Glow -->
    <circle cx="512" cy="512" r="320" fill="#a855f7" opacity="0.18" filter="url(#neonGlowPurple)" />

    <!-- ============================================================== -->
    <!-- THE CENTRAL EMBLEM "C" (CHAMFERED FUTURISTIC MONOGRAM)        -->
    <!-- ============================================================== -->

    <!-- Outer Drop Shadow for Depth -->
    <path d="
      M 410 236
      L 670 236
      L 746 312
      L 746 414
      L 630 414
      L 630 354
      L 580 304
      L 440 304
      L 354 390
      L 354 634
      L 440 720
      L 580 720
      L 630 670
      L 630 610
      L 746 610
      L 746 712
      L 670 788
      L 410 788
      L 278 656
      L 278 368
      Z"
      fill="#000000" opacity="0.6" transform="translate(0, 24)" filter="url(#neonGlowPurple)" />

    <!-- Neon Rim Glow (Back) -->
    <path d="
      M 410 236
      L 670 236
      L 746 312
      L 746 414
      L 630 414
      L 630 354
      L 580 304
      L 440 304
      L 354 390
      L 354 634
      L 440 720
      L 580 720
      L 630 670
      L 630 610
      L 746 610
      L 746 712
      L 670 788
      L 410 788
      L 278 656
      L 278 368
      Z"
      fill="none" stroke="url(#neonBevelOuter)" stroke-width="16" opacity="0.8" filter="url(#neonGlowCyan)" />

    <!-- Outer Solid Body (Layer 1) -->
    <path d="
      M 410 236
      L 670 236
      L 746 312
      L 746 414
      L 630 414
      L 630 354
      L 580 304
      L 440 304
      L 354 390
      L 354 634
      L 440 720
      L 580 720
      L 630 670
      L 630 610
      L 746 610
      L 746 712
      L 670 788
      L 410 788
      L 278 656
      L 278 368
      Z"
      fill="url(#cOuterGrad)" stroke="url(#neonBevelOuter)" stroke-width="7" stroke-linejoin="round" />

    <!-- Top Bevel Highlight (3D Lighting) -->
    <path d="
      M 278 368
      L 410 236
      L 670 236
      L 746 312
      L 720 330
      L 656 266
      L 424 266
      L 308 382
      Z"
      fill="url(#facetHighlight)" />

    <!-- Inner Core Inset (Layer 2 - Beveled Recess) -->
    <path d="
      M 424 286
      L 646 286
      L 704 344
      L 704 384
      L 600 384
      L 556 340
      L 456 340
      L 388 408
      L 388 616
      L 456 684
      L 556 684
      L 600 640
      L 704 640
      L 704 680
      L 646 738
      L 424 738
      L 318 632
      L 318 392
      Z"
      fill="url(#cInnerGrad)" stroke="#c084fc" stroke-width="3" opacity="0.95" />

    <!-- Core Neon Inner Channel (Layer 3 - Glowing Pulse Core) -->
    <path d="
      M 436 332
      L 630 332
      L 662 364
      L 570 364
      L 532 326
      M 374 440
      L 374 584
      M 532 698
      L 570 660
      L 662 660
      L 630 692
      L 436 692
      L 358 614
      L 358 410
      L 436 332"
      fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" filter="url(#neonGlowCyan)" />

    <!-- Central Unlock Spark / Diamond Core (Signifying Cheat / Unlock Power) -->
    <g transform="translate(620, 512)">
      <!-- Pulsing Diamond -->
      <polygon points="0,-36 28,0 0,36 -28,0" fill="#38bdf8" opacity="0.35" filter="url(#neonGlowCyan)" />
      <polygon points="0,-22 18,0 0,22 -18,0" fill="url(#sparkGrad)" />
      <polygon points="0,-12 10,0 0,12 -10,0" fill="#ffffff" />
      
      <!-- Energy Rays -->
      <line x1="-54" y1="0" x2="-26" y2="0" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8" />
      <line x1="26" y1="0" x2="54" y2="0" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8" />
      <line x1="0" y1="-54" x2="0" y2="-26" stroke="#c084fc" stroke-width="3" stroke-linecap="round" opacity="0.8" />
      <line x1="0" y1="26" x2="0" y2="54" stroke="#c084fc" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    </g>

    <!-- Diagonal Glint Reflections -->
    <circle cx="340" cy="330" r="6" fill="#ffffff" opacity="0.9" filter="url(#neonGlowCyan)" />
    <circle cx="680" cy="270" r="4.5" fill="#38bdf8" opacity="0.8" />
    <circle cx="680" cy="754" r="5" fill="#ec4899" opacity="0.8" />
  </g>

  <!-- Border Highlight of the Squircle Tile -->
  <rect x="64" y="64" width="896" height="896" rx="224" ry="224" fill="none" stroke="url(#squircleBorder)" stroke-width="12" />
  <rect x="65" y="65" width="894" height="894" rx="223" ry="223" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4" />
</svg>
